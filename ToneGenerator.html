<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Tone Generator 5000</title>
        <link rel="stylesheet" href="./ToneGenerator.css" />
        <!--<script src="./aubio.js"></script>-->
    </head>
    <body>
        <h1>Tone Generator 5000</h1>
        <h3 class="frequencies">Frequencies: </h3>
        <!--<div id="pitch-display">-- Hz</div>
        <div id="note-display">Waiting for input...</div>
        <br>
        <button id="start-btn">Start Microphone</button>-->
        <div class="container">
            <div class="keyboard"></div>
        </div>
        <div class="settingsBar">
            <span>Keyboard Input: </span>
            <input
                type="text"
                value=""
                placeholder="Type Here"
                name="keyInp" />
            <span>Volume: </span>
            <input
                type="range"
                min="0.0"
                max="1.0"
                step="0.01"
                value="0.5"
                list="volumes"
                name="volume" />
            <datalist id="volumes">
                <option value="0.0" label="Mute"></option>
                <option value="1.0" label="100%"></option>
            </datalist>
            <span>Waveform: </span>
            <select name="waveform">
                <option value="sine" selected>Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
                <option value="custom">Custom</option>
            </select>
            <span>Octave:</span>
            <input
                type="number"
                min="0"
                max="4"
                step="1"
                value="1"
                name="octave" />
            <span>Specific Frequency: </span>
            <input
                type="number"
                min="0"
                max="20000"
                step="0.0001"
                value="220"
                name="specFreq" />
            <input
                type="button"
                value="Play"
                name="playSpecFreq" />
            <div class="left"></div>
            <div class="right"></div>
        </div>

        <script src="./ToneGenerator.js"></script>
    </body>
</html>
