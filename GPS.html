<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>GPS Speedometer</title>
		<style>
			 body, html {
				 width: 100%;
				 height: 100%;
				 font-size: 125%;
				 margin: 0px;
				 font-family: monospace;
				 font-weight: bold;
				 overflow-y: none;
			 }

			 #out {
				 text-align: center;
				 position: absolute;
				 left: 50vw;
				 bottom: 50vh;
				 transform: translate(-50%, 50%);
			 }
		</style>
	</head>
	<body>
		<!--<input id="runBtn" type="button" value="Or Click Here">-->
		<div id="out">Click Anywhere To Start!</div>
		<script>
			const out = document.getElementById("out");
			var interval;

			/*if (confirm("Enable Geolocation?")) {
				navigator.geolocation.getCurrentPosition((coords) => {
					alert("Geolocation Enabled! (Accuracy: " + coords.coords.accuracy.toFixed(1) + ")")
				});
			}*/

			document.body.onclick = (evt) => {
				evt.preventDefault();
				navigator.permissions.query({name: "geolocation"}).then((result) => {
					if (result.state === "granted") {
						interval = window.setInterval(() => {navigator.geolocation.getCurrentPosition((coords) => {
							let c = coords.coords.speed;
							c = (!c) ? 0:c;
							let alt = coords.coords.altitude;
							alt = (!alt) ? 0:alt;
							let head = coords.coords.heading;
							head = (!head) ? 0:head;
							let acc = coords.coords.accuracy;
							acc = (!acc) ? 0:acc;
							let acc2 = coords.coords.altitudeAccuracy;
							acc2 = (!acc2) ? 0:acc2;
							try {
								out.innerText = c.toFixed(3) + " m/s\n" + (c * 2.23693629).toFixed(3) + " mph\n" + (c * 3.6).toFixed(3) + " km/h\n" + (c / 343).toFixed(3) + " Mach\n" + (c / 299792458).toFixed(3) + " Lightspeed\n\nAltitude:\n" + alt.toFixed(3) + " Meters\n" + (alt * 3.28084).toFixed(3) + " Feet\n\nHeading:\n" + head.toFixed(3) + " Degrees\n\nAccuracy:\n" + acc.toFixed(1) + "m Lat/Lon\n" + acc2.toFixed(1) + "m Alt";
							} catch (err) {
								console.log(err);
								//alert(err);
							}
						}, (err) => {
							console.log(err);
						}, {
							enableHighAccuracy: true,
							maximumAge: 0
						})}, 10);
					} else if (result.state === "prompt") {
						navigator.geolocation.getCurrentPosition((position) => { /* handle success */ }, (error) => { /* handle error */ }, {enableHighAccuracy: true, maximumAge: 0});
					} else if (result.state === "denied") {
						alert("Geolocation API Unavailable: Access Denied. Please Grant The Webpage Access To Your Location.");
					}
				});
			};
		</script>
	</body>
</html>
